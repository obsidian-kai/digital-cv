                      # other value (or no value) means no border will be displayed
        title: Behavioural Password Protection
        link: https://finalyearproject2020.wixsite.com/finalyearproject2020
        link_text: Final Year Project 2020
        additional_links:
          - title:  Behavioural Password Protection
            icon: fab fa-github
            url: https://github.com/obsidian-kai/FYP
          - title:  Behavioural Password Protection
            icon: fab fa-youtube
            url: https://www.youtube.com/watch?v=k5TPriRXZD0
        # quote: >
        #   Final year project
        description: | # this will include new lines to allow paragraphs
          This FYP project is to suggest new passwords for users by using a "training" process. The idea is to have the software propose password combinations that align with users' preferences for creating their own passwords. For instance, if a user often uses multiple alphabets from their children's names, the software will suggest secure password options that still cater to the user's preferences.
          
          Languages: PHP, HTML, CSS, Javascript, Bootstrap, Python
          
          Tools: 
          - Alibaba Cloud DNS for domain name
          - VPS (Virtual Private Server) hosting from SparkedHost.com
          - SSL certificate from Cloudflare
          - Internet Information Services
          - XAMPP and Navicat for MySQL database
          - Swift Mailer using Composer
